version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily" # tu peux mettre daily pour voir vite le résultat
    labels:
      - "dependencies"
    versioning-strategy: increase
    open-pull-requests-limit: 10
    dev-deps:
      dependency-type: "development"
      update-types: ["minor", "patch"]
    all-minor-patch:
      patterns: ["*"]
      update-types: ["minor", "patch"]